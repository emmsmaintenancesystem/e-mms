# =============================================================================
# e-MaintenanceManagementSystem (e-MMS)
# GitHub Actions Workflow: Build & Deploy Frontend SPA to GitHub Pages
# =============================================================================
name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Frontend (Vite + React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Verify VITE_API_BASE_URL repository variable
        env:
          API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::ยังไม่ได้ตั้งค่า Repository Variable ชื่อ VITE_API_BASE_URL ใน GitHub Settings -> Secrets and variables -> Actions -> Variables"
          else
            echo "Building frontend with VITE_API_BASE_URL=$API_URL"
          fi

      - name: Typecheck & Build production bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
